name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install imrestore with development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      # The scripts must work from any directory, so run them from outside
      # the repository; then execute the benchmark notebook.
      - name: Run the scripts and the notebook
        if: matrix.python-version == '3.13'
        working-directory: ${{ runner.temp }}
        env:
          MPLBACKEND: Agg
        run: |
          for script in demo_adaptive_gd demo_quasi_newton_fbs demo_var_pdal restoration_demo; do
            python "$GITHUB_WORKSPACE/scripts/$script.py" --outdir "$RUNNER_TEMP/figures"
          done
          for nb in 00_getting_started 01_restoration_benchmark; do
            jupyter nbconvert --to notebook --execute --output "$RUNNER_TEMP/$nb.ipynb" \
              "$GITHUB_WORKSPACE/examples/$nb.ipynb"
          done
